# TraceLens configuration — all values here are the defaults.
# Copy and edit this file per project; it is loaded from the working directory.

[tracelens]
judge_model = "gemini/gemini-3.5-flash"     # litellm model string for claim verification
max_claims_per_step = 20                     # cap on claim decomposition per step
attribution_threshold = 0.15                 # flag step as root cause if score > this
                                             # (lowered from 0.7 — new formula produces smaller scores)
db_path = "tracelens.db"                     # SQLite database path
temperature = 0.3                            # slightly higher temp improves ensemble diversity
max_concurrent_verifications = 1             # keep 1 on Gemini free tier (15 req/min)
verification_timeout_s = 60                  # per-verification timeout in seconds

# HTTP API security and trace privacy. Keep api_key out of this file in real
# deployments; use the TRACELENS_API_KEY environment variable instead.
# api_key = "set-via-environment-preferably"
allowed_origins = []                         # exact browser origins allowed to call the API
max_request_bytes = 1000000                  # reject larger HTTP request bodies
redact_sensitive_data = true                 # redact common secrets and email addresses before storage
redaction_replacement = "[REDACTED]"
# retention_days = 30                         # automatically purge older trace data on ingestion

# Ensemble NLI settings — controls non-determinism correction
nli_ensemble_votes = 1          # number of independent NLI judge calls per claim
                                # 1 = single-shot (fast, non-deterministic)
                                # 3 = recommended (good balance of cost vs accuracy)
                                # 5 = high-confidence (slower, more expensive)
nli_min_agreement = 0.67        # minimum fraction of judges that must agree
                                # e.g. 0.67 = need 2/3 votes to match
                                # if agreement < this, verdict is "uncertain"
use_semantic_propagation = true # one semantic claim-propagation judgement per step

[costs]
# Approximate USD per token — used for cost estimates printed at diagnosis end.
input_per_million = 0.075
output_per_million = 0.30

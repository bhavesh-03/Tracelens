[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracelens"
version = "0.1.0"
description = "Automated causal root-cause diagnostics for multi-agent AI systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.40.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "networkx>=3.3",
    "typer>=0.12.0",
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "python-dotenv>=1.0.0",
    "graphviz>=0.20",
    "rich>=13.0.0",
    "streamlit-agraph>=0.0.45",
]

[project.scripts]
tracelens = "tracelens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"examples/code_reviewer/chat.py" = ["E402"]
"examples/code_reviewer/agent.py" = ["E402"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.19",
]
